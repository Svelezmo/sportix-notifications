spring.application.name=sportix-notifications
server.port=${PORT:5000}

# Secretos en el .env (ignorado por Git). "optional:" -> arranca aunque no exista.
spring.config.import=optional:file:.env[.properties]

# ======================= Seguridad =======================
# Clave que Sportixcore envía en el header X-API-Key. Vacía = no se exige.
notifications.api-key=${NOTIFICATION_API_KEY:}

# ======================= Correo =======================
# smtp | console
notifications.mail.mode=${MAIL_MODE:console}
notifications.mail.from-name=${MAIL_FROM_NAME:Sportix}
# true = responde a Sportixcore sin esperar a Gmail (el correo sale en segundo plano)
notifications.mail.async=${MAIL_ASYNC:false}

# Gmail por SMTP con contraseña de aplicación (solo se usa con MAIL_MODE=smtp)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
spring.mail.default-encoding=UTF-8
# Velocidad: sin estas dos, JavaMail busca el nombre del equipo en el DNS
# (InetAddress.getLocalHost) para el saludo EHLO y para el Message-ID. En
# Windows esa búsqueda puede tardar 5-10 s CADA una.
spring.mail.properties.mail.smtp.localhost=${MAIL_EHLO_NAME:localhost}
spring.mail.properties.mail.from=${GMAIL_USERNAME:}
